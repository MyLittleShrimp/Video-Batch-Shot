<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:191px; height:410px; overflow:hidden; }
  body { font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif; background:#fff; position:relative; }
  .top { position:absolute; left:0; top:0; width:191px; height:196px;
         background:linear-gradient(158deg,#5f96ff 0%,#2f6bed 52%,#1a41b2 100%); overflow:hidden; }
  .c1 { position:absolute; left:-34px; top:-40px; width:150px; height:150px; border-radius:50%;
        background:rgba(255,255,255,.12); }
  .c2 { position:absolute; right:-30px; bottom:-52px; width:140px; height:140px; border-radius:50%;
        background:rgba(255,255,255,.09); }
  .plate { position:absolute; left:36px; top:38px; width:118px; height:118px; background:#fff;
           border-radius:30px; box-shadow:0 5px 16px rgba(9,24,64,.20); }
  .icon { position:absolute; left:53px; top:55px; width:86px; height:86px; }
  .name { position:absolute; left:0; top:212px; width:191px; text-align:center;
          font-size:17px; font-weight:700; color:#1c2532; line-height:26px; }
  .rule { position:absolute; left:64px; top:280px; width:62px; height:2px; background:#e2e7ef; border-radius:2px; }
  .tag { position:absolute; left:0; top:294px; width:191px; text-align:center;
         font-size:11px; color:#89929f; }
  .ver { position:absolute; left:0; bottom:13px; width:191px; text-align:center;
         font-size:10px; color:#b6bec9; }
</style></head>
<body>
  <div class="top"><div class="c1"></div><div class="c2"></div></div>
  <div class="plate"></div>
  <img class="icon" src="icon.svg" />
  <div class="name">视频批量<br>截图工具</div>
  <div class="rule"></div>
  <div class="tag">批量导入 · 一键取帧</div>
  <div class="ver">v1.0.0</div>
</body></html>
